name: Flutter CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get
        working-directory: 12-week-12-testing-quality-assurance

      - name: Check Formatting
        run: dart format --output=none --set-exit-if-changed lib test
        working-directory: 12-week-12-testing-quality-assurance

      - name: Analyze Code
        run: flutter analyze --no-fatal-infos
        working-directory: 12-week-12-testing-quality-assurance

      - name: Run Tests with Coverage
        run: flutter test --coverage
        working-directory: 12-week-12-testing-quality-assurance

      - name: Build Android APK
        run: flutter build apk --release --android-skip-build-dependency-validation
        working-directory: 12-week-12-testing-quality-assurance

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release --android-skip-build-dependency-validation
        working-directory: 12-week-12-testing-quality-assurance

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            12-week-12-testing-quality-assurance/build/app/outputs/flutter-apk/app-release.apk
            12-week-12-testing-quality-assurance/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
